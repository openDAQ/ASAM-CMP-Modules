name: Build ASAM CMP module stagings

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: "The commit to stage, in full (empty: the head of the branch dispatched on)"
        default: ""
      opendaq-ref:
        description: "openDAQ commit, branch or tag. If empty, uses the opendaq_ref file from the repo."
        default: ""
      skip-staging-push:
        description: "Build only, keep the staging as an artifact of the run"
        type: boolean
        default: false
  # from another repository's run (the bundle): staged as an artifact of that run, never pushed
  workflow_call:
    inputs:
      ref:
        description: "The commit to stage, in full (empty: the commit this workflow is called at)"
        type: string
        default: ""
      opendaq-ref:
        description: "openDAQ commit, branch or tag. If empty, uses the opendaq_ref file from the repo."
        type: string
        default: ""
      exclude-jobs:
        description: "Jobs not built, wildcard patterns, e.g. '[\"manylinux*\"]': their openDAQ stagings not pulled either"
        type: string
        default: "[]"

jobs:
  resolve:
    name: Resolve the commits
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.commits.outputs.ref }}
      opendaq-ref: ${{ steps.commits.outputs.opendaq-ref }}
      opendaq-channel: ${{ fromJSON(steps.channel.outputs.depends-channels)['openDAQ/openDAQ'] || 'dev' }}
      repository: ${{ job.workflow_repository }}
      channel: ${{ steps.channel.outputs.channel }}
      skip-staging-push: ${{ inputs.skip-staging-push || job.workflow_ref != github.workflow_ref || (github.event_name == 'schedule' && steps.channel.outputs.released != 'true') }}
    steps:
      # this repository, also when called from another one
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.ref || job.workflow_sha }}

      # the commit staged and the core it is built against; a branch or a tag of the core is resolved to the commit,
      # which is what the core staging is found by and what this staging records
      - name: Resolve the commits
        id: commits
        shell: python3 {0}
        env:
          OPENDAQ_REF: ${{ inputs.opendaq-ref }}
        run: |
          import os, re, subprocess, sys

          sha = subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True, text=True, check=True).stdout.strip()

          # the input, or else opendaq_ref
          core = os.environ["OPENDAQ_REF"] or open("opendaq_ref").read().strip()
          if not re.fullmatch(r"[0-9a-f]{40}", core):
              out = subprocess.run(["git", "ls-remote", "https://github.com/openDAQ/openDAQ", core, f"{core}^{{}}"],
                                   capture_output=True, text=True, check=True).stdout
              # the peeled tag (X^{}) sorts last, so a tag gives its commit, not the tag object
              core = sorted(out.splitlines(), key=lambda line: line.split("\t")[1])[-1].split("\t")[0] if out else ""
          if not core:
              sys.exit(f"::error::{os.environ['OPENDAQ_REF'] or 'opendaq_ref'} names no openDAQ commit")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"ref={sha}\n")
              f.write(f"opendaq-ref={core}\n")

      # where each lies picks its channel
      - uses: openDAQ/openDAQ-CI/.github/actions/resolve-channel@bundle/extract-each-artifact-into-its-dir
        id: channel
        with:
          repository: ${{ job.workflow_repository }}
          commit: ${{ steps.commits.outputs.ref }}
          depends: '{"openDAQ/openDAQ": "${{ steps.commits.outputs.opendaq-ref }}"}'


  stage:
    needs: resolve
    name: ASAM-CMP-Module
    permissions:
      contents: read
      packages: write
    uses: openDAQ/openDAQ-CI/.github/workflows/stage.yml@bundle/extract-each-artifact-into-its-dir
    with:
      repository: ${{ needs.resolve.outputs.repository }}
      ref: ${{ needs.resolve.outputs.ref }}
      upload-pattern: asam-cmp-modules-*
      timeout: '[{"timeout-minutes": 180}]'
      include-jobs: >-
        [
          "windows-2022-x86_64-msvs-v143-release",
          "windows-2022-x86-msvs-v143-release",
          "manylinux_2_28-x86_64-ninja-gcc-14-release",
          "manylinux_2_28-armv8-ninja-gcc-14-release",
          "ubuntu-22.04-x86_64-ninja-gcc-release",
          "ubuntu-22.04-armv8-ninja-gcc-release",
          "macos-26-x86_64-ninja-appleclang-21-release",
          "macos-26-armv8-ninja-appleclang-21-release"
        ]
      exclude-jobs: ${{ inputs.exclude-jobs || '[]' }}
      staging-pull: >-
        [
          {
            "match-jobs": ["windows-2022-x86_64-msvs-v143-release"],
            "artifact": "opendaq-staging-windows-2022-x86_64-msvs-v143-release",
            "packages": [{
              "path": "ghcr.io/${{ github.repository_owner }}/${{ needs.resolve.outputs.opendaq-channel }}/staging/opendaq",
              "annotations": {
                "org.opencontainers.image.revision": "${{ needs.resolve.outputs.opendaq-ref }}",
                "com.opendaq.package.triplet": "x86_64-windows-msvc-143-release"
              }
            }]
          },
          {
            "match-jobs": ["windows-2022-x86-msvs-v143-release"],
            "artifact": "opendaq-staging-windows-2022-x86-msvs-v143-release",
            "packages": [{
              "path": "ghcr.io/${{ github.repository_owner }}/${{ needs.resolve.outputs.opendaq-channel }}/staging/opendaq",
              "annotations": {
                "org.opencontainers.image.revision": "${{ needs.resolve.outputs.opendaq-ref }}",
                "com.opendaq.package.triplet": "x86-windows-msvc-143-release"
              }
            }]
          },
          {
            "match-jobs": ["manylinux_2_28-x86_64-ninja-gcc-14-release"],
            "artifact": "opendaq-staging-manylinux_2_28-x86_64-ninja-gcc-14-release",
            "packages": [{
              "path": "ghcr.io/${{ github.repository_owner }}/${{ needs.resolve.outputs.opendaq-channel }}/staging/opendaq",
              "annotations": {
                "org.opencontainers.image.revision": "${{ needs.resolve.outputs.opendaq-ref }}",
                "com.opendaq.package.triplet": "x86_64-manylinux_2_28-gcc-14-release"
              }
            }]
          },
          {
            "match-jobs": ["manylinux_2_28-armv8-ninja-gcc-14-release"],
            "artifact": "opendaq-staging-manylinux_2_28-armv8-ninja-gcc-14-release",
            "packages": [{
              "path": "ghcr.io/${{ github.repository_owner }}/${{ needs.resolve.outputs.opendaq-channel }}/staging/opendaq",
              "annotations": {
                "org.opencontainers.image.revision": "${{ needs.resolve.outputs.opendaq-ref }}",
                "com.opendaq.package.triplet": "armv8-manylinux_2_28-gcc-14-release"
              }
            }]
          },
          {
            "match-jobs": ["ubuntu-22.04-x86_64-ninja-gcc-release"],
            "artifact": "opendaq-staging-ubuntu-22.04-x86_64-ninja-gcc-release",
            "packages": [{
              "path": "ghcr.io/${{ github.repository_owner }}/${{ needs.resolve.outputs.opendaq-channel }}/staging/opendaq",
              "annotations": {
                "org.opencontainers.image.revision": "${{ needs.resolve.outputs.opendaq-ref }}",
                "com.opendaq.package.triplet": "x86_64-linux-gcc-11-release"
              }
            }]
          },
          {
            "match-jobs": ["ubuntu-22.04-armv8-ninja-gcc-release"],
            "artifact": "opendaq-staging-ubuntu-22.04-armv8-ninja-gcc-release",
            "packages": [{
              "path": "ghcr.io/${{ github.repository_owner }}/${{ needs.resolve.outputs.opendaq-channel }}/staging/opendaq",
              "annotations": {
                "org.opencontainers.image.revision": "${{ needs.resolve.outputs.opendaq-ref }}",
                "com.opendaq.package.triplet": "armv8-linux-gcc-11-release"
              }
            }]
          },
          {
            "match-jobs": ["macos-26-x86_64-ninja-appleclang-21-release"],
            "artifact": "opendaq-staging-macos-26-x86_64-ninja-appleclang-21-release",
            "packages": [{
              "path": "ghcr.io/${{ github.repository_owner }}/${{ needs.resolve.outputs.opendaq-channel }}/staging/opendaq",
              "annotations": {
                "org.opencontainers.image.revision": "${{ needs.resolve.outputs.opendaq-ref }}",
                "com.opendaq.package.triplet": "x86_64-macos-apple-clang-21-release"
              }
            }]
          },
          {
            "match-jobs": ["macos-26-armv8-ninja-appleclang-21-release"],
            "artifact": "opendaq-staging-macos-26-armv8-ninja-appleclang-21-release",
            "packages": [{
              "path": "ghcr.io/${{ github.repository_owner }}/${{ needs.resolve.outputs.opendaq-channel }}/staging/opendaq",
              "annotations": {
                "org.opencontainers.image.revision": "${{ needs.resolve.outputs.opendaq-ref }}",
                "com.opendaq.package.triplet": "armv8-macos-apple-clang-21-release"
              }
            }]
          }
        ]
      packages: >-
        [
          {
            "match-jobs": ["windows-2022-x86_64-msvs-v143-release"],
            "artifacts": [{"name": "opendaq-staging-windows-2022-x86_64-msvs-v143-release", "dir": "staging-deps"}]
          },
          {
            "match-jobs": ["windows-2022-x86-msvs-v143-release"],
            "artifacts": [{"name": "opendaq-staging-windows-2022-x86-msvs-v143-release", "dir": "staging-deps"}]
          },
          {
            "match-jobs": ["manylinux_2_28-x86_64-ninja-gcc-14-release"],
            "artifacts": [{"name": "opendaq-staging-manylinux_2_28-x86_64-ninja-gcc-14-release", "dir": "staging-deps"}]
          },
          {
            "match-jobs": ["manylinux_2_28-armv8-ninja-gcc-14-release"],
            "artifacts": [{"name": "opendaq-staging-manylinux_2_28-armv8-ninja-gcc-14-release", "dir": "staging-deps"}]
          },
          {
            "match-jobs": ["ubuntu-22.04-x86_64-ninja-gcc-release"],
            "artifacts": [{"name": "opendaq-staging-ubuntu-22.04-x86_64-ninja-gcc-release", "dir": "staging-deps"}]
          },
          {
            "match-jobs": ["ubuntu-22.04-armv8-ninja-gcc-release"],
            "artifacts": [{"name": "opendaq-staging-ubuntu-22.04-armv8-ninja-gcc-release", "dir": "staging-deps"}]
          },
          {
            "match-jobs": ["macos-26-x86_64-ninja-appleclang-21-release"],
            "artifacts": [{"name": "opendaq-staging-macos-26-x86_64-ninja-appleclang-21-release", "dir": "staging-deps"}]
          },
          {
            "match-jobs": ["macos-26-armv8-ninja-appleclang-21-release"],
            "artifacts": [{"name": "opendaq-staging-macos-26-armv8-ninja-appleclang-21-release", "dir": "staging-deps"}]
          },
          {
            "match-jobs": ["ubuntu-*"],
            "apt-install": ["libpcap-dev"]
          },
          {
            "match-jobs": ["manylinux*"],
            "yum-install": ["libpcap-devel"]
          },
          {
            "match-jobs": ["windows-*-x86-*"],
            "run": "vcpkg install openssl:x86-windows; Add-Content -Path $env:GITHUB_PATH -Value C:\\vcpkg\\installed\\x86-windows\\bin -Encoding utf8"
          }
        ]
      cmake-presets: >-
        [
          {
            "match-jobs": ["*"],
            "configure-preset": "stage",
            "cache-variables":
            {
              "CMAKE_PREFIX_PATH": "${sourceDir}/staging-deps;${sourceDir}/staging-deps/opt/opendaq",
              "CPACK_OPENDAQ_META_FIELDS": "dependencies/opendaq/revision=${{ needs.resolve.outputs.opendaq-ref }}"
            }
          },
          {
            "match-jobs": ["macos-*-x86_64-*"],
            "cache-variables": {"CMAKE_OSX_DEPLOYMENT_TARGET": "10.15"}
          },
          {
            "match-jobs": ["macos-*-armv8-*"],
            "cache-variables": {"CMAKE_OSX_DEPLOYMENT_TARGET": "11.0"}
          }
        ]
      cpack-presets: >-
        [
          {
            "match-jobs": ["*"],
            "stagings": [{"name": "asam-cmp"}]
          }
        ]
      skip-staging-push: ${{ needs.resolve.outputs.skip-staging-push == 'true' }}
      staging-push: >-
        [
          {
            "path": "ghcr.io/${{ github.repository_owner }}/${{ needs.resolve.outputs.channel || 'dev' }}/staging/asam-cmp-modules",
            "artifacts": ["asam-cmp-modules-staging-*/asam-cmp"],
            "idx-identity": ["org.opencontainers.image.revision", "com.opendaq.dependencies.opendaq.revision"],
            "pkg-identity": ["org.opencontainers.image.revision", "com.opendaq.dependencies.opendaq.revision", "com.opendaq.package.triplet"]
          }
        ]
