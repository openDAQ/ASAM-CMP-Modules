name: Build ASAM CMP module stagings

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      opendaq-ref:
        description: "openDAQ commit, branch or tag. If empty, uses the opendaq_ref file from the repo."
        default: ""


jobs:
  resolve:
    name: Resolve the core commit
    runs-on: ubuntu-latest
    outputs:
      opendaq-ref: ${{ steps.core.outputs.ref }}
      channel: ${{ steps.channel.outputs.channel }}
      jobs: ${{ steps.stagings.outputs.jobs }}
      staging-pull: ${{ steps.stagings.outputs.staging-pull }}
      opendaq-artifacts: ${{ steps.stagings.outputs.opendaq-artifacts }}
    steps:
      - uses: actions/checkout@v4

      - uses: openDAQ/openDAQ-CI/.github/actions/resolve-channel@v4
        id: channel

      # the input, or else opendaq_ref; a branch or a tag is resolved to the commit, which is
      # what the core staging is found by and what this staging records
      - name: Resolve the core commit
        id: core
        shell: bash
        env:
          REF: ${{ inputs.opendaq-ref }}
        run: |
          ref="${REF:-$(cat opendaq_ref)}"
          sha="$ref"
          if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            sha=$(git ls-remote https://github.com/openDAQ/openDAQ "$ref" "$ref^{}" | sort -k2 | tail -1 | cut -f1)
          fi
          [ -n "$sha" ] || { echo "::error::$ref names no openDAQ commit"; exit 1; }
          echo "core: $ref -> $sha"
          echo "ref=$sha" >> "$GITHUB_OUTPUT"

      # the jobs to build, and the openDAQ staging each of them builds against
      - name: Request the openDAQ stagings
        id: stagings
        shell: python3 {0}
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          OPENDAQ_REF: ${{ steps.core.outputs.ref }}
        run: |
          import json, os

          # job -> the openDAQ staging it builds against, by triplet
          opendaq = {
              "windows-2022-x86_64-msvs-v143-release":       "x86_64-windows-msvc-143-release",
              "windows-2022-x86-msvs-v143-release":          "x86-windows-msvc-143-release",
              "manylinux_2_28-x86_64-ninja-gcc-14-release":  "x86_64-manylinux_2_28-gcc-14-release",
              "manylinux_2_28-armv8-ninja-gcc-14-release":   "armv8-manylinux_2_28-gcc-14-release",
              "ubuntu-22.04-x86_64-ninja-gcc-release":       "x86_64-linux-gcc-11-release",
              "ubuntu-22.04-armv8-ninja-gcc-release":        "armv8-linux-gcc-11-release",
              "macos-26-x86_64-ninja-appleclang-21-release": "x86_64-macos-apple-clang-21-release",
              "macos-26-armv8-ninja-appleclang-21-release":  "armv8-macos-apple-clang-21-release",
          }

          # each staging, of the resolved commit, as an artifact of its own ...
          pull = [{"artifact": f"opendaq-{triplet}", "packages": [{
                      "path": f"ghcr.io/openDAQ/{os.environ['CHANNEL']}/staging/opendaq",
                      "annotations": {"org.opencontainers.image.revision": os.environ["OPENDAQ_REF"],
                                      "com.opendaq.package.triplet": triplet}}]}
                  for triplet in opendaq.values()]

          # ... which its job unpacks into staging-deps
          artifacts = [{"match-jobs": [job], "artifacts": [{"name": f"opendaq-{triplet}", "dir": "staging-deps"}]}
                       for job, triplet in opendaq.items()]

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"jobs={json.dumps(list(opendaq))}\n")
              f.write(f"staging-pull={json.dumps(pull)}\n")
              f.write(f"opendaq-artifacts={json.dumps(artifacts)[1:-1]}\n")   # no brackets: it goes inside packages

  stage:
    needs: resolve
    name: ASAM-CMP-Module
    permissions:
      contents: read
      packages: write
    uses: openDAQ/openDAQ-CI/.github/workflows/stage.yml@v4
    with:
      timeout: '[{"timeout-minutes": 180}]'
      include-jobs: ${{ needs.resolve.outputs.jobs }}
      staging-pull: ${{ needs.resolve.outputs.staging-pull }}
      packages: >-
        [
          ${{ needs.resolve.outputs.opendaq-artifacts }},
          { "match-jobs": ["ubuntu-*"],        "apt-install": ["libpcap-dev"] },
          { "match-jobs": ["manylinux*"],      "yum-install": ["libpcap-devel"] },
          { "match-jobs": ["windows-*-x86-*"], "run": "vcpkg install openssl:x86-windows; Add-Content -Path $env:GITHUB_PATH -Value C:\\vcpkg\\installed\\x86-windows\\bin -Encoding utf8" }
        ]
      cmake-presets: >-
        [
          {
            "match-jobs": ["*"],
            "configure-preset": "stage",
            "cache-variables":
            {
              "CMAKE_PREFIX_PATH": "${sourceDir}/staging-deps;${sourceDir}/staging-deps/opt/opendaq",
              "CPACK_OPENDAQ_META_FIELDS": "dependencies/opendaq/revision=${{ needs.resolve.outputs.opendaq-ref }}"
            }
          },
          {
            "match-jobs": ["macos-*-x86_64-*"],
            "cache-variables": {"CMAKE_OSX_DEPLOYMENT_TARGET": "10.15"}
          },
          {
            "match-jobs": ["macos-*-armv8-*"],
            "cache-variables": {"CMAKE_OSX_DEPLOYMENT_TARGET": "11.0"}
          }
        ]
      cpack-presets: >-
        [
          {
            "match-jobs": ["*"],
            "stagings": [{"name": "asam-cmp"}]
          }
        ]
      staging-push: >-
        [
          {
            "path": "ghcr.io/${{ github.repository_owner }}/${{ needs.resolve.outputs.channel }}/staging/asam-cmp-modules",
            "artifacts": ["staging-*/asam-cmp"],
            "tags": ["latest"]
          }
        ]
